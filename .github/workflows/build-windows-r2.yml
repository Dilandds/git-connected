name: Build Windows → R2 (fast dev builds)

# Builds only the Windows edition(s) you choose and uploads the resulting
# ZIP(s) straight to Cloudflare R2 from the runner — skips GitHub Artifacts
# entirely (the slow upload-then-download roundtrip in the normal
# build.yml flow), and skips building macOS too. Meant for quick iteration
# while testing a Windows-specific fix, not for tagged releases (those
# still go through release.yml).
#
# Requires the same repo secrets release.yml already uses:
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Which edition(s) to build'
        required: true
        type: choice
        default: 'commercial'
        options:
          - all
          - commercial
          - lite
          - core

jobs:
  build-and-upload:
    name: Build Windows + upload to R2
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0.0"

      - name: Rebuild rhino3dm with a statically-linked runtime
        run: python scripts\build_rhino3dm_static.py

      # ---- Commercial ----
      - name: Build Commercial edition
        if: ${{ inputs.edition == 'all' || inputs.edition == 'commercial' }}
        run: powershell -ExecutionPolicy Bypass -File build_windows.ps1

      - name: Zip Commercial dist
        if: ${{ inputs.edition == 'all' || inputs.edition == 'commercial' }}
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "LYNS360-Windows.zip" -Force

      # ---- Lite ----
      - name: Build Lite edition
        if: ${{ inputs.edition == 'all' || inputs.edition == 'lite' }}
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          powershell -ExecutionPolicy Bypass -File build_windows_lite.ps1

      # ---- Core ----
      - name: Build Core edition
        if: ${{ inputs.edition == 'all' || inputs.edition == 'core' }}
        run: |
          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          powershell -ExecutionPolicy Bypass -File build_windows_core.ps1

      - name: Upload built ZIP(s) to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ectoform-downloads
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          DEST="dev-builds/${RUN_ID}"
          FOUND=0
          echo "## Windows dev build → R2" >> "$GITHUB_STEP_SUMMARY"
          for f in LYNS360-Windows.zip LYNS360-Lite-Windows.zip LYNS360-Core-Windows.zip; do
            if [ -f "$f" ]; then
              FOUND=1
              echo "Uploading $f ..."
              aws s3 cp "$f" "s3://${BUCKET}/${DEST}/${f}" \
                --endpoint-url "$R2_ENDPOINT" --region auto \
                --cache-control "public, max-age=3600"
              echo "- [$f](https://downloads.ectoform.studio/${DEST}/${f})" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "::error::No built ZIP found to upload — build step(s) may have failed silently."
            exit 1
          fi
          echo ""
          echo "Done — see the job summary for direct download links."
