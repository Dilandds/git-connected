name: Windows UI Screenshots

on:
  workflow_dispatch:

jobs:
  screenshot-windows:
    name: Capture UI Screenshots (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run app in screenshot mode
        run: |
          python main.py --screenshot-mode --screenshot-outdir screenshots
        timeout-minutes: 10

      - name: List captured screenshots
        if: always()
        run: |
          Write-Host "Contents of screenshots/:"
          Get-ChildItem screenshots -ErrorAction SilentlyContinue | Format-Table Name, Length

      - name: Upload screenshots artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-windows
          path: screenshots/
          retention-days: 14
          if-no-files-found: warn
